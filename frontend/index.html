<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- ── Primary SEO ──────────────────────────────── -->
    <title>QwikBasket by Real Farms</title>
    <meta name="description" content="QwikBasket by Real Farms delivers fresh groceries, dairy, fruits & vegetables to your door in 45–60 minutes. Order online for Qwik or scheduled Smart Delivery. Best prices guaranteed." />
    <meta name="keywords" content="online grocery delivery, fresh vegetables, dairy delivery, farm fresh, quick grocery delivery, QwikBasket, Real Farms, same day delivery, bulk grocery, B2B grocery" />
    <meta name="author" content="QwikBasket by Real Farms" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://qwikbasket.in/" />

    <!-- ── Open Graph (Facebook / LinkedIn / WhatsApp) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QwikBasket" />
    <meta property="og:title" content="QwikBasket – Fresh Grocery & Farm Delivery" />
    <meta property="og:description" content="Get fresh groceries, dairy & farm produce delivered in 45–60 mins. Qwik & Smart Delivery options. Best prices. Order now on QwikBasket." />
    <meta property="og:url" content="https://qwikbasket.in/" />
    <meta property="og:image" content="https://qwikbasket.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- ── Twitter Card ──────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@QwikBasket" />
    <meta name="twitter:title" content="QwikBasket" />
    <meta name="twitter:description" content="Fresh groceries delivered in 45–60 mins. Qwik & Smart Delivery. Order now!" />
    <meta name="twitter:image" content="https://qwikbasket.in/og-image.jpg" />

    <!-- ── PWA & Browser ─────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.jpg" />
    <link rel="apple-touch-icon" href="/icon-192.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1FB33B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QwikBasket" />

    <!-- ── Performance Hints ────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- ── Structured Data: Local Business ─────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GroceryStore",
      "name": "QwikBasket by Real Farms",
      "description": "Fresh grocery & farm produce delivery service offering Qwik (45–60 min) and Smart scheduled delivery.",
      "url": "https://qwikbasket.in",
      "logo": "https://qwikbasket.in/icon-192.jpg",
      "image": "https://qwikbasket.in/og-image.jpg",
      "priceRange": "₹₹",
      "currenciesAccepted": "INR",
      "paymentAccepted": "Cash, Credit Card, UPI",
      "servesCuisine": "Grocery",
      "openingHours": "Mo-Su 07:00-20:00",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "availableLanguage": ["English", "Hindi"]
      },
      "sameAs": [
        "https://www.instagram.com/qwikbasket",
        "https://www.facebook.com/qwikbasket"
      ]
    }
    </script>

    <!-- ── Structured Data: WebSite (Sitelinks Search) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "QwikBasket",
      "url": "https://qwikbasket.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://qwikbasket.in/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
