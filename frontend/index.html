    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GroceryStore",
      "name": "Real Farms",

      "description": "Real Farms is an organic farm-to-doorstep grocery delivery service. We deliver fresh vegetables, fruits, dairy & daily essentials directly from certified Indian farms — no middlemen, guaranteed freshness.",

      "logo": "https://realfarms.in/icon-192.jpg",
      "image": "https://realfarms.in/og-image.jpg",
      "priceRange": "₹₹",
      "currenciesAccepted": "INR",
      "paymentAccepted": "Cash, Credit Card, Debit Card, UPI, Net Banking",
      "servesCuisine": "Organic Grocery",
      "openingHours": "Mo-Su 07:00-21:00",
      "areaServed": "India",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Fresh Organic Groceries",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Fresh Vegetables" }},
          { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Organic Fruits" }},
          { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Dairy Products" }},
          { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Daily Essentials" }}
        ]
      },
      "contactPoint": {
        "@type": "ContactPoint",

        "availableLanguage": ["English", "Hindi"]
      },
      "sameAs": [
        "https://www.instagram.com/realfarmsindia",
        "https://www.facebook.com/realfarmsindia"
      ]
    }
    </script>

    <!-- ── Structured Data: WebSite (Sitelinks Search) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Real Farms",
      "url": "https://realfarms.in",
      "description": "India's most trusted farm-to-door organic grocery delivery platform.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://realfarms.in/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ── Structured Data: Organization ──────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
